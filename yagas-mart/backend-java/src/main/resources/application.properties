# Server Configuration
server.port=8080
spring.application.name=yagas-mart-backend

# Enable Java 24 Virtual Threads for Spring Boot Web & Scheduling
spring.threads.virtual.enabled=true

# Local Poster Archival Directory Path
yagasmart.poster.output-dir=C:/YagasMartPosters

# Gemini API Configuration (Spring AI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:demo_key}
spring.ai.google.genai.chat.options.model=gemini-1.5-flash

# Channel Default Configuration
yagasmart.whatsapp.group-name=Yaga's Mart Sendurai Community
yagasmart.whatsapp.status-enabled=true
yagasmart.instagram.account-id=yagas_mart_sendurai_official
yagasmart.facebook.page-token=

# Cron Dispatch Time Configuration (Daily 06:00 AM IST)
yagasmart.cron.pre-generate-time=0 45 5 * * ?
yagasmart.cron.dispatch-time=0 0 6 * * ?
