<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>YAGA MOBILES | Every Accessory. One Destination.</title>
<style>
:root{--orange:#ff8700;--hot:#ff4c00;--ink:#070707;--white:#f7f7f7}
*{box-sizing:border-box}
html,body{margin:0;background:#080808;color:var(--white);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{position:relative;isolation:isolate;min-height:600px;height:min(650px,82vh);overflow:hidden;background:radial-gradient(ellipse at 76% 55%,rgba(255,92,0,.2),transparent 36%),linear-gradient(110deg,#050505 0%,#0b0908 60%,#160900 100%)}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(#000,transparent 92%)}
.hero:after{content:"";position:absolute;left:-5%;right:-5%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--orange),#fff0c9,var(--hot),transparent);box-shadow:0 0 20px var(--orange);z-index:5}
.grid-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 55%,rgba(255,110,0,.23),transparent 28%);animation:glowbeat 2.8s ease-in-out infinite}
.copy{position:relative;z-index:4;width:51%;padding:clamp(34px,5vw,78px) 0 35px clamp(25px,5.2vw,100px)}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px;opacity:0;transform:translateY(16px);animation:brandIn .65s .15s forwards}
.brand-icon{width:43px;height:43px;border:1.5px solid var(--orange);border-radius:12px;display:grid;place-items:center;color:var(--orange);font-size:24px;box-shadow:0 0 22px #ff870044,inset 0 0 12px #ff870022}
.brand-name{font-size:clamp(25px,2.6vw,38px);font-weight:950;letter-spacing:.045em;line-height:1}
.brand-name b{color:var(--orange)}
.eyebrow{display:inline-block;border:1px solid #ff870099;border-radius:99px;padding:8px 13px;color:#ffd5a6;background:#ff870010;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:0;animation:brandIn .6s .42s forwards}
h1{margin:22px 0 14px;font-size:clamp(40px,4.5vw,70px);line-height:.98;letter-spacing:-.055em;text-transform:uppercase;font-weight:950}
h1 span{display:block;color:var(--orange);text-shadow:0 0 28px #ff720044}
.line{display:block;opacity:0;transform:translateY(20px);animation:lineIn .65s .68s forwards}
.line:nth-child(2){animation-delay:.88s}
.description{max-width:560px;color:#d0d0d0;font-size:clamp(13px,1.1vw,16px);line-height:1.6;margin:0 0 22px;opacity:0;animation:lineIn .65s 1.08s forwards}
.cta{display:inline-flex;align-items:center;gap:13px;padding:16px 23px;border-radius:9px;text-decoration:none;color:#111;font-size:12px;font-weight:950;letter-spacing:.06em;background:linear-gradient(105deg,#ffb13b,#ff8500 55%,#ff5c00);box-shadow:0 8px 28px #ff690044,inset 0 1px #ffffff66;transition:transform .2s,filter .2s;opacity:0;animation:lineIn .65s 1.25s forwards,ctaPulse 2.4s 2s infinite}
.cta:hover{transform:translateY(-3px);filter:brightness(1.1)}
.cta .arrow{font-size:19px}
.tags{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:25px;color:#a8a8a8;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:0;animation:lineIn .65s 1.4s forwards}
.tags span:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--orange);margin:0 7px 1px 0;box-shadow:0 0 8px var(--orange)}
.stage{position:absolute;z-index:2;right:0;top:0;width:57%;height:100%;display:grid;place-items:center;overflow:hidden;mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 100%)}
.stage:before{content:"";position:absolute;width:68%;height:62%;right:5%;top:20%;border-radius:50%;background:#ff70002b;filter:blur(75px);animation:glowbeat 2.8s ease-in-out infinite}
.product-frame{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateX(8%) scale(.86);filter:blur(5px);transition:opacity .12s,transform .36s cubic-bezier(.16,.8,.2,1),filter .25s}
.product-frame.active{opacity:1;transform:translateX(0) scale(1);filter:blur(0)}
.product-frame.flash-out{opacity:0;transform:translateX(-7%) scale(1.08);filter:blur(8px)}
.product-frame img{width:88%;height:84%;object-fit:contain;filter:drop-shadow(0 22px 30px #000b);animation:productFloat 3.6s ease-in-out infinite}
.product-frame[data-scene="collection"] img{width:100%;height:100%;object-fit:contain}
.product-frame[data-scene="charger"] img,.product-frame[data-scene="neckband"] img,.product-frame[data-scene="earbuds"] img,.product-frame[data-scene="headphones"] img,.product-frame[data-scene="power"] img{width:74%;height:82%}
.stage-ring{position:absolute;width:78%;height:32%;bottom:9%;right:5%;border:2px solid #ff8700aa;border-radius:50%;transform:rotate(-8deg);box-shadow:0 0 16px #ff870077,inset 0 0 20px #ff870022;animation:ringSpin 11s linear infinite}
.stage-ring:after{content:"";position:absolute;inset:12px;border:1px dashed #ff9b3866;border-radius:50%}
.scene-caption{position:absolute;z-index:3;right:7%;bottom:8%;font-size:clamp(10px,1vw,14px);font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#ffd09a;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .15s}
.scene-caption.show{opacity:1}
.flash{position:absolute;z-index:6;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.hit{animation:flashHit .22s ease-out}
.sound-toggle{position:absolute;z-index:9;top:18px;right:20px;border:1px solid #ff870077;background:#080808cc;color:#fff;border-radius:99px;padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(8px)}
.sound-toggle span{color:var(--orange);margin-right:6px}
.progress{position:absolute;z-index:8;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--orange),#ffd08a);box-shadow:0 0 12px var(--orange)}
@keyframes brandIn{to{opacity:1;transform:translateY(0)}}
@keyframes lineIn{to{opacity:1;transform:translateY(0)}}
@keyframes productFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes ringSpin{to{transform:rotate(352deg)}}
@keyframes glowbeat{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
@keyframes ctaPulse{0%,100%{box-shadow:0 8px 28px #ff690044,inset 0 1px #ffffff66}50%{box-shadow:0 8px 36px #ff690099,inset 0 1px #ffffff88}}
@keyframes flashHit{0%{opacity:.0}15%{opacity:.34}100%{opacity:0}}
@media(max-width:900px){.hero{height:auto;min-height:720px}.copy{width:68%;padding:42px 0 290px 30px}.stage{width:68%;height:57%;top:auto;bottom:0}.product-frame img{height:90%}.stage-ring{bottom:8%}}
@media(max-width:560px){.hero{min-height:790px}.copy{width:100%;padding:28px 21px 330px}.brand{margin-bottom:20px}.brand-icon{width:37px;height:37px}.brand-name{font-size:26px}.eyebrow{font-size:9px;letter-spacing:.1em}h1{font-size:clamp(38px,11vw,52px);margin-top:19px}.description{font-size:13px;max-width:410px}.cta{padding:14px 17px;font-size:10px}.tags{font-size:8px;gap:8px 12px;margin-top:18px}.stage{width:100%;height:43%;mask-image:linear-gradient(180deg,transparent 0%,#000 18%)}.product-frame img{width:90%;height:90%}.product-frame[data-scene="collection"] img{width:100%;height:100%}.stage-ring{width:86%;right:7%;bottom:9%}.sound-toggle{top:12px;right:12px;padding:8px 11px;font-size:10px}.scene-caption{right:7%;bottom:7%;font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.product-frame{opacity:0!important}.product-frame.active{opacity:1!important}}
</style>
</head>

const scenes = [
 {key:"charger",label:"POWER UP. FAST.",duration:650,hit:1},
 {key:"neckband",label:"WIRELESS FREEDOM.",duration:650,hit:1},
 {key:"earbuds",label:"SOUND WITHOUT LIMITS.",duration:650,hit:1},
 {key:"headphones",label:"FEEL EVERY BEAT.",duration:650,hit:1},
 {key:"power",label:"POWER. STYLE. EVERYDAY.",duration:650,hit:1},
 {key:"collection",label:"EVERY ACCESSORY. ONE DESTINATION.",duration:2300,hit:1}
];
const frames=[...document.querySelectorAll(".product-frame")];
const caption=document.getElementById("sceneCaption");
const flash=document.getElementById("flash");
const progress=document.getElementById("progress");
const soundToggle=document.getElementById("soundToggle");
const total=scenes.reduce((s,x)=>s+x.duration,0);
let sceneIndex=-1,sceneStart=0,loopStart=0,raf=0,audioCtx=null,soundOn=false,beatTimer=null;
frames.forEach(f=>{const key=f.dataset.scene;f.querySelector("img").src="data:image/webp;base64,"+assets[key]});

function activateScene(index,now){
 const scene=scenes[index]; frames.forEach(f=>f.classList.remove("active","flash-out"));
 const active=frames.find(f=>f.dataset.scene===scene.key);
 active.classList.add("active");
 caption.textContent=scene.label;caption.classList.add("show");
 flash.classList.remove("hit");void flash.offsetWidth;flash.classList.add("hit");
 sceneIndex=index;sceneStart=now;
 if(soundOn) playImpact(index===scenes.length-1? "final":"cut",index);
}
function tick(now){
 if(!loopStart)loopStart=now;
 const elapsed=(now-loopStart)%total;
 let acc=0,index=0;
 for(;index<scenes.length-1;index++){if(elapsed<acc+scenes[index].duration)break;acc+=scenes[index].duration}
 if(index!==sceneIndex)activateScene(index,now);
 progress.style.width=(elapsed/total*100)+"%";
 raf=requestAnimationFrame(tick);
}
function ensureAudio(){
 if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;audioCtx=new AC()}
 if(audioCtx.state==="suspended")audioCtx.resume();
 return true;
}
function tone(freq,start,duration,type="sine",gain=.08,endFreq=null){
 if(!audioCtx)return;
 const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,start);
 if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),start+duration);
 g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+duration);
 osc.connect(g);g.connect(audioCtx.destination);osc.start(start);osc.stop(start+duration+.03);
}
function noiseSweep(start,duration=.24,gain=.045){
 if(!audioCtx)return;
 const buffer=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*duration),audioCtx.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
 const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
 src.buffer=buffer;filter.type="highpass";filter.frequency.setValueAtTime(700,start);filter.frequency.exponentialRampToValueAtTime(4500,start+duration);
 g.gain.setValueAtTime(gain,start);g.gain.exponentialRampToValueAtTime(.0001,start+duration);
 src.connect(filter);filter.connect(g);g.connect(audioCtx.destination);src.start(start);src.stop(start+duration);
}
function playImpact(kind,index){
 if(!audioCtx||!soundOn)return;
 const t=audioCtx.currentTime;
 noiseSweep(t,.22,.035);
 if(kind==="final"){tone(95,t,.65,"sine",.18,42);tone(440,t+.06,.55,"triangle",.045,660);tone(660,t+.16,.7,"sine",.025,880)}
 else {tone(125-index*4,t,.28,"sine",.13,48);tone(720+index*80,t+.025,.11,"triangle",.025,280)}
}
function startBed(){
 if(!audioCtx||beatTimer)return;
 const start=audioCtx.currentTime;
 // Soft cinematic pulse, synthesized locally; no external audio file or network request.
 const pulse=()=>{if(!soundOn||!audioCtx)return;const t=audioCtx.currentTime;tone(55,t,.42,"sine",.055,42);tone(110,t+.04,.2,"triangle",.018,82);beatTimer=setTimeout(pulse,650)};
 pulse();
}
function stopBed(){if(beatTimer){clearTimeout(beatTimer);beatTimer=null}}
soundToggle.addEventListener("click",()=>{
 soundOn=!soundOn;
 soundToggle.setAttribute("aria-pressed",String(soundOn));
 soundToggle.innerHTML=soundOn?'<span>♫</span> SOUND ON':'<span>♪</span> SOUND OFF';
 if(soundOn){if(ensureAudio()){startBed();playImpact("final",0)}}else{stopBed();if(audioCtx){const t=audioCtx.currentTime;const g=audioCtx.createGain();g.gain.setValueAtTime(0,t)}}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden){cancelAnimationFrame(raf);stopBed()}else{loopStart=0;sceneIndex=-1;raf=requestAnimationFrame(tick);if(soundOn&&audioCtx)startBed()}});
raf=requestAnimationFrame(tick);
</script>
