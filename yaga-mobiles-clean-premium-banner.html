<style>
:root{--orange:#ff8700;--ink:#08090b}
*{box-sizing:border-box}
html,body{margin:0;background:#08090b;font-family:Inter,Arial,sans-serif}
.hero-shell{width:100%;max-width:1920px;margin:0 auto;background:#08090b;overflow:hidden;position:relative;isolation:isolate}
.artwork{display:block;width:100%;height:auto;transform:scale(1.006);animation:slowBreath 18s ease-in-out infinite alternate;transform-origin:65% 50%}
.hero-shell:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#ff8500,#ffd08a,#ff5900,transparent);box-shadow:0 0 15px #ff850088;pointer-events:none}
.cta-hotspot{position:absolute;left:3.4%;top:79.5%;width:27%;height:12%;border-radius:999px;z-index:3;display:block;cursor:pointer}
.cta-hotspot:focus-visible{outline:3px solid white;outline-offset:4px}
.sound-toggle{position:absolute;right:18px;top:18px;z-index:4;border:1px solid #ff9a0070;background:#08090bdc;color:#fff;border-radius:999px;padding:9px 13px;font-size:10px;font-weight:800;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(8px)}
.sound-toggle .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff8700;margin-right:7px;box-shadow:0 0 8px #ff8700}
@keyframes slowBreath{from{transform:scale(1.006)}to{transform:scale(1.025)}}
@media(max-width:700px){
 .artwork{animation:none;transform:none}
 .cta-hotspot{left:8%;top:48%;width:76%;height:7.5%}
 .sound-toggle{top:10px;right:10px;padding:7px 10px;font-size:9px}
}
@media(prefers-reduced-motion:reduce){.artwork{animation:none;transform:none}}
</style>

<script>
/* Optional subtle brand sting; audio only plays after the visitor opts in. */
const btn=document.getElementById('soundToggle');
let enabled=false,ctx=null;
function sting(){
 const AudioContext=window.AudioContext||window.webkitAudioContext;
 if(!AudioContext)return;
 if(!ctx)ctx=new AudioContext();
 if(ctx.state==='suspended')ctx.resume();
 const now=ctx.currentTime;
 [[110,.32,.055],[220,.24,.025],[440,.42,.018]].forEach(([hz,dur,vol],i)=>{
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=i===0?'sine':'triangle';
  osc.frequency.setValueAtTime(hz,now+i*.09);
  gain.gain.setValueAtTime(.0001,now+i*.09);
  gain.gain.exponentialRampToValueAtTime(vol,now+i*.09+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,now+i*.09+dur);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(now+i*.09);osc.stop(now+i*.09+dur+.03);
 });
}
btn.addEventListener('click',()=>{
 enabled=!enabled;
 btn.setAttribute('aria-pressed',String(enabled));
 btn.innerHTML='<span class="dot"></span>'+(enabled?'PLAY BRAND STING':'SOUND OFF');
 if(enabled)sting();
});
</script>
